<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GEN Z STORE - PS4</title>
    <style>
      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f8fbfe url("images/background.jpg") center center / cover no-repeat fixed;
        color: #183b5b;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0) 38%, rgba(13,53,83,.09)),
          radial-gradient(circle at 50% 48%, rgba(255,255,255,.12), rgba(255,255,255,0) 44%);
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 130px rgba(16,61,92,.18);
      }

      .ambient {
        position: fixed;
        pointer-events: none;
        border-radius: 50%;
        filter: blur(2px);
        opacity: .45;
      }

      .ambient-a {
        width: 260px;
        height: 260px;
        left: -120px;
        top: 18%;
        background: radial-gradient(circle, rgba(23,105,170,.16), transparent 68%);
      }

      .ambient-b {
        width: 320px;
        height: 320px;
        right: -150px;
        bottom: 8%;
        background: radial-gradient(circle, rgba(23,105,170,.13), transparent 68%);
      }

      .scanline {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .045;
        background: repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 3px,
          rgba(20,70,105,.35) 4px
        );
      }

      #brand {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 17px 9px 13px;
        border-radius: 999px;
        background: rgba(255,255,255,.80);
        border: 1px solid rgba(23,105,170,.20);
        box-shadow: 0 7px 24px rgba(20,55,85,.13);
        backdrop-filter: blur(9px);
        white-space: nowrap;
      }

      #brand b {
        font-size: 15px;
        font-weight: 900;
        letter-spacing: .16em;
        color: #1769aa;
      }

      .brand-sub {
        padding-left: 9px;
        border-left: 1px solid rgba(23,105,170,.25);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .13em;
        color: #66839a;
      }

      .brand-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2e9d6e;
        box-shadow: 0 0 0 4px rgba(46,157,110,.12), 0 0 13px rgba(46,157,110,.55);
        animation: pulse 1.7s ease-in-out infinite;
      }

      @keyframes pulse {
        50% { transform: scale(.72); opacity: .58; }
      }

      .orbit {
        position: fixed;
        top: 68%;
        left: 50%;
        width: 120px;
        height: 120px;
        margin: -60px 0 0 -60px;
      }

      .orbit-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(23,105,170,.18);
      }

      .orbit-ring-a {
        animation: orbitA 2.3s linear infinite;
        border-top-color: rgba(23,105,170,.75);
      }

      .orbit-ring-b {
        inset: 10px;
        animation: orbitB 1.6s linear infinite reverse;
        border-right-color: rgba(46,157,110,.65);
      }

      @keyframes orbitA {
        to { transform: rotate(360deg); }
      }

      @keyframes orbitB {
        to { transform: rotate(360deg); }
      }

      #spin {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid rgba(23,105,170,.15);
        border-top-color: #1769aa;
        border-right-color: #1769aa;
        border-radius: 50%;
        animation: spin .75s linear infinite;
        box-shadow: 0 4px 16px rgba(23,105,170,.14);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #msg {
        position: fixed;
        top: calc(68% + 72px);
        left: 50%;
        transform: translateX(-50%);
        min-width: 340px;
        padding: 12px 22px;
        text-align: center;
        font-size: 15px;
        font-weight: 700;
        color: #183b5b;
        background: rgba(255,255,255,.90);
        border: 1px solid rgba(23,105,170,.18);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(20,55,85,.13);
        display: none;
      }

      .msg-title {
        color: #b33a3a;
        font-size: 11px;
        letter-spacing: .18em;
      }

      #wrap { padding: 0; }

      #state, #out { display: none; }

      body.done .orbit,
      body.fail .orbit {
        display: none;
      }

      body.fail #msg {
        display: block;
      }

      body.log .orbit,
      body.log #msg {
        display: none;
      }

      body.log #wrap {
        position: fixed;
        inset: 0;
        padding: 80px 18px 18px;
      }

      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 850;
        margin: 0 0 8px;
        color: #1769aa;
      }

      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.45 Consolas, monospace;
        color: #183b5b;
        background: rgba(255,255,255,.92);
        border: 1px solid rgba(23,105,170,.18);
        border-radius: 12px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
        box-shadow: 0 10px 30px rgba(20,55,85,.12);
      }

      .ok, .safe { color: #287d5b; }
      .bad, .danger { color: #b33a3a; }
      .warn { color: #a56b00; }
      code { color: #1769aa; }

      @media (max-width: 900px) {
        #brand { top: 15px; }
      }
    </style>
  </head>
  <body>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="scanline"></div>
    <div id="brand">
      <span class="brand-dot"></span>
      <b>GEN Z STORE</b>
      <span class="brand-sub">PS4 WEBKIT</span>
    </div>
    <div class="orbit">
      <div class="orbit-ring orbit-ring-a"></div>
      <div class="orbit-ring orbit-ring-b"></div>
      <div id="spin"></div>
    </div>
    <div id="msg"><span class="msg-title">PROCESS FINISHED</span><br>Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
