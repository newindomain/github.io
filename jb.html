<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GEN Z STORE • PS4</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #c8ced8;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      }
      body {
        background: #0b0d10 url("images/background.jpg") center center / cover no-repeat fixed;
      }
      #brand {
        text-align: center;
        padding: 9px 10px;
        background: rgba(14, 17, 22, .88);
        border-bottom: 1px solid #1e2732;
      }
      #brand b {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: .14em;
        color: #e6ebf2;
      }
      #brand span {
        display: block;
        margin-top: 2px;
        font-size: 11px;
        letter-spacing: .08em;
        color: #8b95a3;
      }
      #spin {
        position: fixed;
        top: calc(50% + 18px);
        left: 50%;
        width: 42px;
        height: 42px;
        margin: -21px 0 0 -21px;
        border: 3px solid rgba(30,39,50,.9);
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin .9s linear infinite;
      }
      #msg {
        position: fixed;
        top: calc(50% - 34px);
        left: 0;
        right: 0;
        text-align: center;
        font-size: 16px;
        letter-spacing: .5px;
        display: block;
        color: #e6ebf2;
      }
      #msg::after {
        content: " • • •";
        color: #7fd0a0;
        animation: dots 1.2s steps(4,end) infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes dots {
        0% { opacity: .25; }
        50% { opacity: 1; }
        100% { opacity: .25; }
      }
      #wrap { padding: 0; }
      #state, #out { display: none; }
      body.done #spin, body.done #msg { display: none; }
      body.fail #spin { display: none; }
      body.fail #msg { display: block; }
      body.fail #msg::after { content: ""; }
      body.log #spin, body.log #msg { display: none; }
      body.log #wrap { padding: 14px 18px; }
      body.log #state { display: block; font-size: 22px; font-weight: 700; margin: 0 0 8px; }
      body.log #out { display: block; white-space: pre-wrap;
        font: 12px/1.45 Consolas, monospace; background: rgba(17,21,27,.94);
        border: 1px solid #1e2732; border-radius: 5px; padding: 10px 12px;
        height: calc(100vh - 141px); overflow-y: auto; }
      .ok { color: #7fd0a0; } .bad { color: #d08a7f; } .warn { color: #d8c07f; }
      .safe { color: #7fd0a0; } .danger { color: #d08a7f; }
      code { color: #9fb3d0; }
    </style>
  </head>
  <body>
    <div id="brand"><b>GEN Z STORE • PS4</b><span>WEBKIT JAILBREAK</span></div>
    <div id="spin"></div>
    <div id="msg">Jailbreak en cours</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
