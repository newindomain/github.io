<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEN Z STORE - PS4</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f8fbfe url("images/background.jpg") center center / cover no-repeat fixed;
    color: #183b5b;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0) 38%, rgba(13,53,83,.09)),
      radial-gradient(circle at 50% 48%, rgba(255,255,255,.12), rgba(255,255,255,0) 44%);
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 130px rgba(16,61,92,.18);
  }

  .ambient {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    filter: blur(2px);
    opacity: .45;
  }

  .ambient-a {
    width: 260px;
    height: 260px;
    left: -120px;
    top: 18%;
    background: radial-gradient(circle, rgba(23,105,170,.16), transparent 68%);
  }

  .ambient-b {
    width: 320px;
    height: 320px;
    right: -150px;
    bottom: 8%;
    background: radial-gradient(circle, rgba(23,105,170,.13), transparent 68%);
  }

  .scanline {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .045;
    background: repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      rgba(20,70,105,.35) 4px
    );
  }

  #brand {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 17px 9px 13px;
    border-radius: 999px;
    background: rgba(255,255,255,.80);
    border: 1px solid rgba(23,105,170,.20);
    box-shadow: 0 7px 24px rgba(20,55,85,.13);
    backdrop-filter: blur(9px);
    white-space: nowrap;
  }

  #brand b {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: .16em;
    color: #1769aa;
  }

  .brand-sub {
    padding-left: 9px;
    border-left: 1px solid rgba(23,105,170,.25);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .13em;
    color: #66839a;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2e9d6e;
    box-shadow: 0 0 0 4px rgba(46,157,110,.12), 0 0 13px rgba(46,157,110,.55);
    animation: pulse 1.7s ease-in-out infinite;
  }

  @keyframes pulse {
    50% { transform: scale(.72); opacity: .58; }
  }

  #wrap {
    position: fixed;
    left: 50%;
    bottom: 45px;
    transform: translateX(-50%);
    width: min(780px, calc(100vw - 50px));
    box-sizing: border-box;
    padding: 22px 28px 20px;
    text-align: center;
    background: rgba(255,255,255,.84);
    border: 1px solid rgba(23,105,170,.20);
    border-radius: 18px;
    box-shadow:
      0 18px 50px rgba(20,55,85,.16),
      0 2px 0 rgba(255,255,255,.8) inset;
    backdrop-filter: blur(10px);
  }

  .eyebrow {
    margin-bottom: 5px;
    color: #7690a4;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .22em;
  }

  #state {
    font-size: 24px;
    font-weight: 850;
    margin: 0 0 5px;
    color: #1769aa;
    text-shadow: 0 1px 0 #fff;
  }

  #det {
    font-size: 14px;
    color: #46657e;
    margin: 0 0 6px;
  }

  #det b {
    color: #183b5b;
    font-weight: 800;
  }

  #cache {
    display: inline-block;
    min-width: 110px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    color: #55748c;
    background: rgba(235,243,249,.72);
    border: 1px solid rgba(23,105,170,.10);
  }

  #cache.cacheok {
    color: #287d5b;
    background: rgba(229,247,239,.85);
    border-color: rgba(40,125,91,.16);
  }

  .ok { color: #287d5b; }
  .bad { color: #b33a3a; }
  .warn { color: #a56b00; }

  @media (max-width: 900px) {
    #wrap { bottom: 28px; }
    #brand { top: 15px; }
  }
</style>
</head>
<body>
<div class="ambient ambient-a"></div>
<div class="ambient ambient-b"></div>
<div class="scanline"></div>
<div id="brand">
  <span class="brand-dot"></span>
  <b>GEN Z STORE</b>
  <span class="brand-sub">PS4 WEBKIT</span>
</div>
<div id="wrap">
  <div class="eyebrow">GEN Z STORE • SYSTEM READY</div>
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
